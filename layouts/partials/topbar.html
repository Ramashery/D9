{{- $h := site.Data.home -}}
<div class="topbar" id="topbar">
  <a href="#top" class="topbar__logo" aria-label="{{ $h.logo.alt }} — home">
    <img src="{{ $h.logo.url }}" alt="{{ $h.logo.alt }}" loading="eager" decoding="async" fetchpriority="high">
  </a>
  <button type="button" class="topbar__menu" id="menuBtn" aria-haspopup="true" aria-expanded="false">Menu</button>
</div>
